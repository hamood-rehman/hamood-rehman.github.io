<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d">
  <title id="t">Series-stacked SiC switch and its per-stage voltage-balancing loop</title>
  <desc id="d">Left: three stages connected in series between drain and source. Each stage has an isolated auxiliary supply fed from a common auxiliary input, a gate driver with dv/dt control, and a 3.3 kV SiC MOSFET. Right: the balancing loop in each stage. The drain-source voltage is sensed, sampled and held at turn-off, compared with a reference by a PI controller, which sets a BJT in the Kelvin-source path that acts as a controlled resistance and sets the MOSFET turn-off dv/dt on the next pulse.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#52514e"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2a78d6"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="469" rx="8" fill="#fcfcfb" stroke="#e4e3df"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#0b0b0b">

    <!-- ===== Panel A: stacked switch ===== -->
    <text x="24" y="34" font-size="16" font-weight="600">Series-stacked switch</text>

    <!-- auxiliary input bus -->
    <text x="40" y="56" font-size="13" fill="#52514e" text-anchor="middle">Aux. input</text>
    <line x1="38" y1="74" x2="38" y2="364" stroke="#52514e" stroke-width="2"/>

    <!-- series MOSFET chain (drain to source) -->
    <text x="452" y="34" font-size="13" fill="#52514e" text-anchor="middle">Drain</text>
    <line x1="452" y1="42" x2="452" y2="86" stroke="#0b0b0b" stroke-width="2"/>
    <line x1="452" y1="142" x2="452" y2="196" stroke="#0b0b0b" stroke-width="2"/>
    <line x1="452" y1="252" x2="452" y2="306" stroke="#0b0b0b" stroke-width="2"/>
    <line x1="452" y1="362" x2="452" y2="398" stroke="#0b0b0b" stroke-width="2"/>
    <text x="452" y="414" font-size="13" fill="#52514e" text-anchor="middle">Source</text>

    <!-- Stage template repeated at y = 66, 176, 286 -->
    <g>
      <rect x="62" y="66" width="438" height="96" rx="8" fill="#f1f0ec"/>
      <text x="74" y="83" font-size="12" fill="#52514e">Stage 1</text>
      <line x1="38" y1="114" x2="78" y2="114" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
      <rect x="80" y="90" width="132" height="48" rx="6" fill="#ffffff" stroke="#c3c2b7"/>
      <text x="146" y="110" font-size="13" text-anchor="middle">Isolated aux.</text>
      <text x="146" y="127" font-size="13" text-anchor="middle">supply (12 kV)</text>
      <line x1="212" y1="114" x2="240" y2="114" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
      <rect x="242" y="90" width="132" height="48" rx="6" fill="#ffffff" stroke="#c3c2b7"/>
      <text x="308" y="110" font-size="13" text-anchor="middle">Gate driver +</text>
      <text x="308" y="127" font-size="13" text-anchor="middle">dv/dt control</text>
      <line x1="374" y1="114" x2="402" y2="114" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
      <rect x="404" y="86" width="96" height="56" rx="6" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.5"/>
      <text x="452" y="110" font-size="13" font-weight="600" text-anchor="middle">3.3 kV SiC</text>
      <text x="452" y="127" font-size="13" font-weight="600" text-anchor="middle">MOSFET</text>
    </g>
    <g>
      <rect x="62" y="176" width="438" height="96" rx="8" fill="#f1f0ec"/>
      <text x="74" y="193" font-size="12" fill="#52514e">Stage 2</text>
      <line x1="38" y1="224" x2="78" y2="224" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
      <rect x="80" y="200" width="132" height="48" rx="6" fill="#ffffff" stroke="#c3c2b7"/>
      <text x="146" y="220" font-size="13" text-anchor="middle">Isolated aux.</text>
      <text x="146" y="237" font-size="13" text-anchor="middle">supply (12 kV)</text>
      <line x1="212" y1="224" x2="240" y2="224" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
      <rect x="242" y="200" width="132" height="48" rx="6" fill="#ffffff" stroke="#c3c2b7"/>
      <text x="308" y="220" font-size="13" text-anchor="middle">Gate driver +</text>
      <text x="308" y="237" font-size="13" text-anchor="middle">dv/dt control</text>
      <line x1="374" y1="224" x2="402" y2="224" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
      <rect x="404" y="196" width="96" height="56" rx="6" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.5"/>
      <text x="452" y="220" font-size="13" font-weight="600" text-anchor="middle">3.3 kV SiC</text>
      <text x="452" y="237" font-size="13" font-weight="600" text-anchor="middle">MOSFET</text>
    </g>
    <g>
      <rect x="62" y="286" width="438" height="96" rx="8" fill="#f1f0ec"/>
      <text x="74" y="303" font-size="12" fill="#52514e">Stage 3</text>
      <line x1="38" y1="334" x2="78" y2="334" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
      <rect x="80" y="310" width="132" height="48" rx="6" fill="#ffffff" stroke="#c3c2b7"/>
      <text x="146" y="330" font-size="13" text-anchor="middle">Isolated aux.</text>
      <text x="146" y="347" font-size="13" text-anchor="middle">supply (12 kV)</text>
      <line x1="212" y1="334" x2="240" y2="334" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
      <rect x="242" y="310" width="132" height="48" rx="6" fill="#ffffff" stroke="#c3c2b7"/>
      <text x="308" y="330" font-size="13" text-anchor="middle">Gate driver +</text>
      <text x="308" y="347" font-size="13" text-anchor="middle">dv/dt control</text>
      <line x1="374" y1="334" x2="402" y2="334" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
      <rect x="404" y="306" width="96" height="56" rx="6" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.5"/>
      <text x="452" y="330" font-size="13" font-weight="600" text-anchor="middle">3.3 kV SiC</text>
      <text x="452" y="347" font-size="13" font-weight="600" text-anchor="middle">MOSFET</text>
    </g>

    <text x="24" y="440" font-size="13" fill="#0b0b0b">10 kV prototype: three 3.3 kV stages, built and tested at reduced bus voltage.</text>
    <text x="24" y="458" font-size="13" fill="#52514e">20 kV version: 6.5 kV-class stages, in design.</text>

    <!-- divider -->
    <line x1="540" y1="24" x2="540" y2="420" stroke="#e4e3df" stroke-width="1"/>

    <!-- ===== Panel B: balancing loop ===== -->
    <text x="566" y="34" font-size="16" font-weight="600">Balancing loop, every stage</text>

    <rect x="566" y="58" width="270" height="44" rx="6" fill="#ffffff" stroke="#c3c2b7"/>
    <text x="701" y="85" font-size="13" text-anchor="middle">Sense V<tspan dy="3" font-size="10">DS</tspan><tspan dy="-3"> (resistive divider)</tspan></text>
    <line x1="701" y1="102" x2="701" y2="122" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="566" y="124" width="270" height="44" rx="6" fill="#ffffff" stroke="#c3c2b7"/>
    <text x="701" y="151" font-size="13" text-anchor="middle">Sample and hold at turn-off</text>
    <line x1="701" y1="168" x2="701" y2="188" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="566" y="190" width="270" height="44" rx="6" fill="#ffffff" stroke="#c3c2b7"/>
    <text x="701" y="217" font-size="13" text-anchor="middle">PI controller vs. reference</text>
    <line x1="701" y1="234" x2="701" y2="254" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="566" y="256" width="270" height="58" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="701" y="280" font-size="13" font-weight="600" text-anchor="middle">Low-voltage BJT in Kelvin-source path</text>
    <text x="701" y="299" font-size="13" text-anchor="middle">acts as a controlled resistance</text>
    <line x1="701" y1="314" x2="701" y2="334" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="566" y="336" width="270" height="44" rx="6" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.5"/>
    <text x="701" y="363" font-size="13" text-anchor="middle">Sets MOSFET turn-off dv/dt</text>

    <!-- feedback to next pulse -->
    <path d="M836 358 H866 V80 H840" fill="none" stroke="#2a78d6" stroke-width="1.75" marker-end="url(#b)"/>
    <text x="872" y="224" font-size="12" fill="#2a78d6" transform="rotate(90 872 224)" text-anchor="middle">next pulse</text>

    <text x="566" y="410" font-size="13" fill="#52514e">The BJT shares the gate driver's local rail,</text>
    <text x="566" y="428" font-size="13" fill="#52514e">so no extra isolated supply is needed.</text>
  </g>
</svg>
